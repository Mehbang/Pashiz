# سامانه مالی پشیز — فایل compose یکپارچه و خودبسنده
# Pashiz — single, self-contained production compose file.
#
# One file that brings up the whole application *and* its administration portal
# (the "پنل مدیریت"). It is a drop-in equivalent of the pair that setup.sh and
# update.sh use —
#
#     docker-compose.prod.yml  +  docker-compose.pashiz.yml
#
# — merged into one, with the two services the fork never runs (ClickHouse and
# watchtower) left out entirely. It keeps the same container names, the same
# named volumes and the same .env, so a stack started from this file is the
# same stack: `./update.sh admin`, `./update.sh admin-url` and
# `./update.sh backup` all keep working against it.
#
# ---------------------------------------------------------------------------
# Usage
# ---------------------------------------------------------------------------
#   1. Generate the secrets .env once:   ./scripts/gen-secrets.sh
#      then set BASE_URL (and PASHIZ_DOMAIN for HTTPS) in .env.
#
#   2. Build and start (plain HTTP):
#        docker compose -f docker-compose.standalone.yml --env-file .env up -d --build
#
#   3. Object store + admin password (what a bare `up` cannot do by itself):
#        sudo ./setup.sh                 # idempotent: finishes Garage + admin
#      or, for just the admin credential:
#        sudo ./update.sh admin
#
#   HTTPS: set in .env  →  PASHIZ_DOMAIN=your.domain
#                          PUBLIC_PROXY_PORT=127.0.0.1:8080
#                          PUBLIC_PROXY_SSL_PORT=127.0.0.1:8443
#   then add the profile so Caddy joins and holds 80/443 alone:
#        docker compose -f docker-compose.standalone.yml --profile https \
#          --env-file .env up -d --build
#
# ---------------------------------------------------------------------------
# NOTE FOR MAINTAINERS: this mirrors docker-compose.prod.yml + .pashiz.yml. If
# you change a service or an environment key there, mirror it here. setup.sh
# and update.sh drive the pair, not this file; this file is the one-file option
# for a manual install.
# ---------------------------------------------------------------------------

services:
  # Envoy routes /api to the server and everything else to the web app.
  proxy:
    container_name: pashiz-proxy
    image: envoyproxy/envoy:v1.30-latest
    depends_on:
      - server
      - webapp
    # Plain HTTP: 80/443 on all interfaces (defaults below). For HTTPS, set
    # these to 127.0.0.1:8080 / 127.0.0.1:8443 in .env so only Caddy is
    # reachable from outside and there is no way in that bypasses TLS.
    ports:
      - '${PUBLIC_PROXY_PORT:-80}:80'
      - '${PUBLIC_PROXY_SSL_PORT:-443}:443'
    tty: true
    volumes:
      - ./docker/envoy/envoy.yaml:/etc/envoy/envoy.yaml
    restart: on-failure
    networks:
      - bigcapital_network

  # The built React interface, served by nginx. Built from this repository's
  # source — never the upstream bigcapitalhq image — so every fork change is in
  # it.
  webapp:
    container_name: pashiz-webapp
    image: pashiz/webapp:latest
    build:
      context: .
      dockerfile: packages/webapp/Dockerfile
    restart: on-failure
    networks:
      - bigcapital_network

  # The NestJS API, and the host of the administration portal.
  server:
    container_name: pashiz-server
    image: pashiz/server:latest
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    expose:
      - '3000'
    depends_on:
      - mysql
      - redis
      - garage
    restart: on-failure
    networks:
      - bigcapital_network
    environment:
      # --- Authentication -------------------------------------------------
      # Every login token is signed and verified with APP_JWT_SECRET. Required
      # with `:?`: the server must refuse to boot rather than fall back to the
      # public default secret baked into the source, which would make every
      # token forgeable. Generate with: openssl rand -hex 48
      - 'APP_JWT_SECRET=${APP_JWT_SECRET:?APP_JWT_SECRET is required — run ./scripts/gen-secrets.sh or: openssl rand -hex 48}'

      # --- Administration portal (پنل مدیریت) -----------------------------
      # The portal lives inside this server; these switch it on. The server
      # answers 404 to everything under the admin path until PATH + a password
      # hash are present, so an unconfigured portal is indistinguishable from
      # one that does not exist. gen-secrets.sh sets PATH and SECRET; the
      # password hash is set by `./update.sh admin` (hashed with scrypt inside
      # this image, so the plaintext is never written anywhere).
      - PASHIZ_ADMIN_PATH=${PASHIZ_ADMIN_PATH:-}
      - PASHIZ_ADMIN_USERNAME=${PASHIZ_ADMIN_USERNAME:-}
      - PASHIZ_ADMIN_PASSWORD_HASH=${PASHIZ_ADMIN_PASSWORD_HASH:-}
      - PASHIZ_ADMIN_SECRET=${PASHIZ_ADMIN_SECRET:-}
      - PASHIZ_ADMIN_SESSION_TTL_MINUTES=${PASHIZ_ADMIN_SESSION_TTL_MINUTES:-120}

      # --- Application ----------------------------------------------------
      - BASE_URL=${BASE_URL}

      # --- Mail (SMTP) ----------------------------------------------------
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_SECURE=${MAIL_SECURE}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}

      # --- Database -------------------------------------------------------
      - DB_HOST=mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_CHARSET=${DB_CHARSET}
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME}
      - TENANT_DB_NAME_PERFIX=${TENANT_DB_NAME_PERFIX}

      # --- Redis (cache + queues) ----------------------------------------
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_HOST=redis
      - QUEUE_PORT=6379

      # --- ClickHouse analytics (disabled in this fork) ------------------
      # The server degrades cleanly with it off, and no ClickHouse container is
      # defined here, so the password is optional. Set CLICKHOUSE_ENABLED=true
      # and point HOST at a real server only if you add one.
      - CLICKHOUSE_ENABLED=${CLICKHOUSE_ENABLED:-false}
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-clickhouse}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-8123}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-bigcapital_analytics}

      # --- Sign-up restrictions ------------------------------------------
      - SIGNUP_DISABLED=${SIGNUP_DISABLED}
      - SIGNUP_ALLOWED_DOMAINS=${SIGNUP_ALLOWED_DOMAINS}
      - SIGNUP_ALLOWED_EMAILS=${SIGNUP_ALLOWED_EMAILS}
      - SIGNUP_EMAIL_CONFIRMATION=${SIGNUP_EMAIL_CONFIRMATION}

      # --- PDF generation (Gotenberg) ------------------------------------
      - GOTENBERG_URL=${GOTENBERG_URL}
      - GOTENBERG_DOCS_URL=${GOTENBERG_DOCS_URL}

      # --- Exchange rate --------------------------------------------------
      - EXCHANGE_RATE_SERVICE=${EXCHANGE_RATE_SERVICE}
      - OPEN_EXCHANGE_RATE_APP_ID=${OPEN_EXCHANGE_RATE_APP_ID}

      # --- Bank sync (Plaid) ----------------------------------------------
      - BANK_FEED_ENABLED=${BANK_FEED_ENABLED}
      - PLAID_ENV=${PLAID_ENV}
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID}
      - PLAID_SECRET=${PLAID_SECRET}
      - PLAID_LINK_WEBHOOK=${PLAID_LINK_WEBHOOK}
      - PLAID_CLIENT_NAME=${PLAID_CLIENT_NAME}

      # --- Billing (hosted SaaS only; unused when self-hosting) ----------
      - LEMONSQUEEZY_API_KEY=${LEMONSQUEEZY_API_KEY}
      - LEMONSQUEEZY_STORE_ID=${LEMONSQUEEZY_STORE_ID}
      - LEMONSQUEEZY_WEBHOOK_SECRET=${LEMONSQUEEZY_WEBHOOK_SECRET}
      - HOSTED_ON_BIGCAPITAL_CLOUD=${HOSTED_ON_BIGCAPITAL_CLOUD}

      # --- Object storage (S3 / self-hosted Garage) ----------------------
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE}

      # --- Stripe payments (optional) ------------------------------------
      - STRIPE_PAYMENT_SECRET_KEY=${STRIPE_PAYMENT_SECRET_KEY}
      - STRIPE_PAYMENT_PUBLISHABLE_KEY=${STRIPE_PAYMENT_PUBLISHABLE_KEY}
      - STRIPE_PAYMENT_CLIENT_ID=${STRIPE_PAYMENT_CLIENT_ID}
      - STRIPE_PAYMENT_WEBHOOKS_SECRET=${STRIPE_PAYMENT_WEBHOOKS_SECRET}
      - STRIPE_PAYMENT_REDIRECT_URL=${STRIPE_PAYMENT_REDIRECT_URL}

      # --- API rate limiting ---------------------------------------------
      - THROTTLE_GLOBAL_TTL=${THROTTLE_GLOBAL_TTL}
      - THROTTLE_GLOBAL_LIMIT=${THROTTLE_GLOBAL_LIMIT}
      - THROTTLE_AUTH_TTL=${THROTTLE_AUTH_TTL}
      - THROTTLE_AUTH_LIMIT=${THROTTLE_AUTH_LIMIT}
    volumes:
      # Only the portal's own backup subdirectory — never ./backups itself,
      # whose archives hold the object-store keys. The portal's dumps hold
      # databases and nothing else.
      - ./backups/portal:/app/backups

  # Runs the migrations once and exits. It is the server image with a different
  # command, so it needs no build of its own; the system migration directory is
  # a path relative to the server package, hence working_dir.
  database_migration:
    container_name: pashiz-database-migration
    image: pashiz/server:latest
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    working_dir: /app/packages/server
    depends_on:
      - mysql
    networks:
      - bigcapital_network
    environment:
      - DB_HOST=mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_CHARSET=${DB_CHARSET}
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME}
      - TENANT_DB_NAME_PERFIX=${TENANT_DB_NAME_PERFIX}
    command:
      - sh
      - -c
      - |
        until nc -z mysql 3306; do
          echo 'waiting for the database...'
          sleep 2
        done
        node dist/cli.js system:migrate:latest &&
        node dist/cli.js tenants:migrate:latest

  mysql:
    container_name: pashiz-mysql
    image: pashiz/mysql:latest
    build:
      context: ./docker/mariadb
    restart: on-failure
    environment:
      - MYSQL_DATABASE=${SYSTEM_DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - mysql:/var/lib/mysql
    expose:
      - '3306'
    networks:
      - bigcapital_network

  redis:
    container_name: pashiz-redis
    image: pashiz/redis:latest
    build:
      context: ./docker/redis
    restart: on-failure
    expose:
      - '6379'
    volumes:
      - redis:/data
    networks:
      - bigcapital_network

  gotenberg:
    container_name: pashiz-gotenberg
    image: gotenberg/gotenberg:7
    restart: on-failure
    networks:
      - bigcapital_network

  garage:
    container_name: pashiz-garage
    image: dxflrs/garage:v1.3.1
    restart: on-failure
    environment:
      - GARAGE_CONFIG_FILE=/etc/garage.toml
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml
      - ./docker/garage/setup.sh:/garage-setup/setup.sh
      - garage:/var/lib/garage
    expose:
      - '3900'
      - '3903'
    networks:
      - bigcapital_network

  # TLS front. Enabled only with the `https` profile and a domain in .env;
  # obtains and renews a Let's Encrypt certificate automatically. When it runs,
  # move Envoy's published ports to loopback (see the usage note at the top) so
  # 80/443 belong to Caddy alone.
  caddy:
    profiles:
      - https
    container_name: pashiz-caddy
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - proxy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      - PASHIZ_DOMAIN=${PASHIZ_DOMAIN}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - bigcapital_network

# Named to match docker-compose.prod.yml exactly, so this file and the pair
# share the same data. A stack started with either sees the same databases and
# the same attachments.
volumes:
  mysql:
    name: bigcapital_prod_mysql
    driver: local
  redis:
    name: bigcapital_prod_redis
    driver: local
  garage:
    name: bigcapital_prod_garage
    driver: local
  caddy_data:
    name: pashiz_caddy_data
    driver: local
  caddy_config:
    name: pashiz_caddy_config
    driver: local
  caddy_logs:
    name: pashiz_caddy_logs
    driver: local

networks:
  bigcapital_network:
    driver: bridge
