# Pashiz production overlay.
#
# `docker-compose.prod.yml` pulls `bigcapitalhq/server` and
# `bigcapitalhq/webapp` from Docker Hub. Those images are upstream Bigcapital
# and contain none of this fork's work, so here the two are built from the
# source in this repository instead.
#
# Always pass both files, in this order:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.pashiz.yml ...
#
# `setup.sh` and `update.sh` do that for you.

services:
  webapp:
    container_name: pashiz-webapp
    image: pashiz/webapp:latest
    build:
      context: .
      dockerfile: packages/webapp/Dockerfile
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  server:
    container_name: pashiz-server
    image: pashiz/server:latest
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    environment:
      # `docker-compose.prod.yml` lists every variable the server receives, so
      # a new key in `.env` reaches the container only if it is named here too.
      # Without these the portal reads no credentials, decides it was never
      # configured, and answers 404 to everything — which looks exactly like a
      # portal that does not exist.
      - PASHIZ_ADMIN_PATH=${PASHIZ_ADMIN_PATH:-}
      - PASHIZ_ADMIN_USERNAME=${PASHIZ_ADMIN_USERNAME:-}
      - PASHIZ_ADMIN_PASSWORD_HASH=${PASHIZ_ADMIN_PASSWORD_HASH:-}
      - PASHIZ_ADMIN_SECRET=${PASHIZ_ADMIN_SECRET:-}
      - PASHIZ_ADMIN_SESSION_TTL_MINUTES=${PASHIZ_ADMIN_SESSION_TTL_MINUTES:-120}

    volumes:
      # Only the portal's own subdirectory, never `./backups` itself.
      #
      # The archives `./update.sh backup` writes there contain `secrets.env` —
      # the object-store keys that bind this installation together. Mounting
      # the parent would put them one download away from anyone who reached
      # the portal. The portal's own dumps hold databases and nothing else.
      - ./backups/portal:/app/backups

  # Upstream builds a dedicated migration image `FROM bigcapitalhq/server` that
  # clones a wait-for-it helper from GitHub at build time. The migration is
  # only the server image running a different command, so it reuses the image
  # built above — one build instead of two, and no network fetch during the
  # build, which matters where GitHub is not reliably reachable.
  database_migration:
    container_name: pashiz-database-migration
    image: pashiz/server:latest
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    # The system migration directory is configured as a path relative to the
    # working directory (`./src/database/system/migrations`), so the command
    # has to run from the server package rather than the image's `/app`.
    working_dir: /app/packages/server
    command:
      - sh
      - -c
      - |
        until nc -z mysql 3306; do
          echo 'waiting for the database...'
          sleep 2
        done
        node dist/cli.js system:migrate:latest &&
        node dist/cli.js tenants:migrate:latest

  mysql:
    container_name: pashiz-mysql

  redis:
    container_name: pashiz-redis

  garage:
    container_name: pashiz-garage

  gotenberg:
    container_name: pashiz-gotenberg

  # Upstream's watchtower polls a registry every hour for a newer `:latest` of
  # whatever it watches, and `docker-compose.prod.yml` labels the webapp and
  # the server for it. That is right for upstream, whose containers run
  # `bigcapitalhq/*` images published to Docker Hub. It is wrong here twice
  # over.
  #
  # This installation's images are built from this checkout by `./update.sh`
  # and named `pashiz/server` and `pashiz/webapp` — names that resolve to
  # `docker.io/pashiz/*`, which nobody has registered. So the poll can only do
  # one of two things: fail, or one day succeed against a namespace this
  # installation does not own and run a stranger's image as the accounting
  # system. There is no third outcome where it helps, because nothing here is
  # ever pulled.
  #
  # It has in fact been failing for another reason — watchtower 1.7.1 speaks
  # Docker API 1.25 and the daemon requires 1.40 — but a broken component is
  # not a safe one, and a version bump on either side would turn it back on.
  #
  # Parked behind a profile that is never enabled, and the labels it keys on
  # are cleared above, so neither the service nor its targets remain.
  auto-update:
    profiles:
      - upstream-only
